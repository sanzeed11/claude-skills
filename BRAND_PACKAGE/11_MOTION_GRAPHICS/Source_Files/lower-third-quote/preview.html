<!doctype html>

<meta charset="utf-8">
<title>Lower third — quote attribution — 5 s — preview over a project image — Sanzeed</title>
<!--
  LOWER THIRD 03 · quote attribution · 5 s · 150 frames @ 30 fps · 1920×1080 · transparent
  Sits beneath a quote that is already on screen. Centred: a short beam with its point, the name, the descriptor, on a soft bottom veil.
  in   0.0–1.1  the veil fades (800 ms); the beam grows and the point travels to its end (800 ms); name 0.3 s, descriptor 0.45 s rise
  hold 1.1–4.0
  out  4.0–4.4  sinks and fades (400 ms, ease-in); the veil fades with it; 4.4–5.0 empty
  PREVIEW: the same lower third composited over an approved project image (06_PHOTOGRAPHY_ART_DIRECTION/Approved_Images). Derived from index.html — edit that, then mirror the change here.
  Render: ../render.sh lower-third-quote/preview.html 1920 1080 5 ../Lower_Thirds sanzeed-lower-third--quote-attribution--preview-1920x1080 mp4
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE =================== */
  :root { --t-in: 0s; --t-out: 4s; --beam-w: 120px; }
  /* ================================================= */
  .veil-bottom { animation: veil 5s linear 0s both; }
  @keyframes veil { 0% { opacity: 0; animation-timing-function: var(--ease); } 16% { opacity: 1; } 80% { opacity: 1; animation-timing-function: var(--ease-in); } 88% { opacity: 0; } 100% { opacity: 0; } }
  .lt { position: absolute; left: 0; right: 0; bottom: 110px; display: flex; flex-direction: column; align-items: center; animation: sz-sink .4s var(--ease-in) var(--t-out) both; }
  .beamrow { position: relative; width: var(--beam-w); height: 12px; margin-bottom: 22px; }
  .beamrow .beam { left: 0; top: 50%; width: 100%; transform-origin: left; animation: sz-grow-x .8s var(--ease) calc(var(--t-in) + .1s) both; }
  .beamrow .point { left: 0; top: 50%; --dot: 10px; --x0: 0px; --x1: var(--beam-w); animation: sz-travel .8s var(--ease) calc(var(--t-in) + .1s) both, sz-fade-in .2s var(--ease) calc(var(--t-in) + .1s) both; }
  .name { font: 600 34px/1.2 var(--font-heading); letter-spacing: -0.01em; color: var(--fg); animation: sz-rise .4s var(--ease) calc(var(--t-in) + .3s) both; }
  .role { font: 400 24px/1.35 var(--font-text); color: var(--fg-2); margin-top: 8px; animation: sz-rise .4s var(--ease) calc(var(--t-in) + .45s) both; }
  .veil-top { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 26%); }
  .label .t { font-size: 26px; } .label .p { font-size: 22px; }
</style>
</head>
<body>
<div class="frame">
  <img class="photo" src="../../../06_PHOTOGRAPHY_ART_DIRECTION/Approved_Images/JPG/sanzeed-img-ram-katha-show-ceiling--projection.jpg" alt="">
  <div class="label" style="position:absolute; right: 120px; top: 96px; z-index: 2; align-items: flex-end; text-align: right;"><span class="t">Ram Katha Show</span><span class="p">Ayodhya</span></div>
  <div class="veil-top"></div>
  <div class="veil-bottom" style="background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 44%, rgba(0,0,0,.66) 70%, rgba(0,0,0,.94) 100%);"></div>
  <div class="lt">
    <div class="beamrow"><div class="beam"></div><div class="point"></div></div>
    <div class="name">— Sanzeed Mirza</div>
    <div class="role">Experiential Design Consultant</div>
  </div>
</div>
</body>
</html>
