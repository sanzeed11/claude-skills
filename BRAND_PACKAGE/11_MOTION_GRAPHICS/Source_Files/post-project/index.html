<title>Post — project — 1080×1080 — 5 s — Sanzeed</title>
<!--
  POST 01 · project · 5 s · 150 frames @ 30 fps · 1080×1080
  0.2  wordmark and eyebrow rise · 0.4–1.5 the image plate settles (1100 ms)
  1.6–2.9  the headline types in word by word; the last word is lit
  3.0  the wall label rises (title, place) · 3.4 the site line · hold to 5 s
  Render: ../render.sh post-project/index.html 1080 1080 5 ../Social_Animations sanzeed-post--project-1080x1080 mp4,gif
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE — image, copy, timing =================== */
  :root { --t-plate: .4s; --t-line: 1.6s; --word-gap: .16s; --t-label: 3s; --t-site: 3.4s; }
  /* ======================================================================= */
  body { --pad: 72px; --eb: 18px; --lt: 28px; --lp: 24px; --site: 20px; }
  .top { position: absolute; left: var(--pad); right: var(--pad); top: var(--pad); display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .wm { width: 220px; animation: sz-rise .4s var(--ease) .2s both; }
  .eyebrow { animation: sz-rise .4s var(--ease) .3s both; }
  .plate { position: absolute; left: var(--pad); right: var(--pad); top: 176px; aspect-ratio: 16 / 9; z-index: 3; animation: sz-scale-in 1.1s var(--ease) var(--t-plate) both; }
  .copy { position: absolute; left: var(--pad); right: var(--pad); top: 730px; z-index: 3; }
  .hl { font-size: 62px; max-width: 16ch; }
  .hl .w { animation: sz-word .4s var(--ease) both; }
  .hl .w:nth-child(1) { animation-delay: var(--t-line); } .hl .w:nth-child(2) { animation-delay: calc(var(--t-line) + var(--word-gap)); }
  .hl .w:nth-child(3) { animation-delay: calc(var(--t-line) + var(--word-gap) * 2); } .hl .w:nth-child(4) { animation-delay: calc(var(--t-line) + var(--word-gap) * 3); }
  .hl .w:nth-child(5) { animation-delay: calc(var(--t-line) + var(--word-gap) * 4); } .hl .w:nth-child(6) { animation-delay: calc(var(--t-line) + var(--word-gap) * 5); }
  .hl .w:nth-child(7) { animation-delay: calc(var(--t-line) + var(--word-gap) * 6); } .hl .w:nth-child(8) { animation-delay: calc(var(--t-line) + var(--word-gap) * 7); }
  .hl .w:nth-child(9) { animation-delay: calc(var(--t-line) + var(--word-gap) * 8); }
  .bottom { position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad); display: flex; align-items: flex-end; justify-content: space-between; z-index: 3; }
  .label .t { animation: sz-rise .4s var(--ease) var(--t-label) both; }
  .label .p { animation: sz-rise .4s var(--ease) calc(var(--t-label) + .15s) both; }
  .site { animation: sz-rise .4s var(--ease) var(--t-site) both; }
</style>
</head>
<body>
<div class="frame grain">
  <div class="top">
    <img class="wm" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed">
    <span class="eyebrow" data-text="eyebrow"></span>
  </div>
  <div class="plate"><img data-src="image" alt=""></div>
  <div class="copy">
    <h1 class="hl" data-headline="headline"></h1>
  </div>
  <div class="bottom">
    <div class="label"><span class="t" data-text="title"></span><span class="p" data-text="place"></span></div>
    <span class="site" data-text="site"></span>
  </div>
</div>
<script src="../fill.js"></script>
</body>
</html>
