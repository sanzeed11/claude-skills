<title>Story — Now showing announcement — 1080×1920 — 6 s — Sanzeed</title>
<!--
  STORY 03 · "Now showing" announcement · 6 s · 180 frames @ 30 fps · 1080×1920
  0.2  wordmark rises
  0.3–1.4  a beam crosses the top of the safe band with its point (1100 ms, ease); the eyebrow NOW SHOWING rises behind it at 0.6 s
  0.9–2.0  the image plate settles (1100 ms)
  2.1–3.0  the headline types in word by word; 3.1 the wall label rises (title, place); 3.6 the site line · hold to 6 s
  Render: ../render.sh story-now-showing/index.html 1080 1920 6 ../Social_Animations sanzeed-story--now-showing-1080x1920 mp4,gif
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE — image, copy, timing =================== */
  :root { --t-beam: .3s; --t-plate: .9s; --t-line: 2.1s; --word-gap: .16s; --t-label: 3.1s; --t-site: 3.6s; }
  /* ======================================================================= */
  body { --pad: 80px; --eb: 22px; --lt: 30px; --lp: 26px; --site: 22px; }
  .top { position: absolute; left: var(--pad); right: var(--pad); top: 270px; z-index: 3; }
  .wm { width: 240px; animation: sz-rise .4s var(--ease) .2s both; }
  .announce { position: absolute; left: var(--pad); right: var(--pad); top: 372px; z-index: 3; }
  .announce .beam { left: 0; right: 0; top: 0; animation: sz-fade-in .4s var(--ease) var(--t-beam) both; }
  .announce .point { left: 0; top: 0; --dot: 14px; --x0: 0px; --x1: 920px; animation: sz-travel 1.1s var(--ease) var(--t-beam) both, point-fade 6s linear 0s both; }
  @keyframes point-fade { 0% { opacity: 0; } 5% { opacity: 0; } 8% { opacity: 1; } 23% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
  .announce .eyebrow { display: block; margin-top: 30px; animation: sz-rise .4s var(--ease) calc(var(--t-beam) + .3s) both; }
  .plate { position: absolute; left: var(--pad); right: var(--pad); top: 480px; aspect-ratio: 16 / 10; z-index: 3; animation: sz-scale-in 1.1s var(--ease) var(--t-plate) both; }
  .copy { position: absolute; left: var(--pad); right: var(--pad); top: 1120px; z-index: 3; }
  .hl { font-size: 84px; max-width: 12ch; }
  .hl .w { animation: sz-word .4s var(--ease) both; }
  .hl .w:nth-child(1) { animation-delay: var(--t-line); } .hl .w:nth-child(2) { animation-delay: calc(var(--t-line) + var(--word-gap)); }
  .hl .w:nth-child(3) { animation-delay: calc(var(--t-line) + var(--word-gap) * 2); } .hl .w:nth-child(4) { animation-delay: calc(var(--t-line) + var(--word-gap) * 3); }
  .hl .w:nth-child(5) { animation-delay: calc(var(--t-line) + var(--word-gap) * 4); } .hl .w:nth-child(6) { animation-delay: calc(var(--t-line) + var(--word-gap) * 5); }
  .hl .w:nth-child(7) { animation-delay: calc(var(--t-line) + var(--word-gap) * 6); } .hl .w:nth-child(8) { animation-delay: calc(var(--t-line) + var(--word-gap) * 7); }
  .label { margin-top: 32px; }
  .label .t { animation: sz-rise .4s var(--ease) var(--t-label) both; }
  .label .p { animation: sz-rise .4s var(--ease) calc(var(--t-label) + .15s) both; }
  .bottom { position: absolute; left: var(--pad); bottom: 266px; z-index: 3; animation: sz-rise .4s var(--ease) var(--t-site) both; }
</style>
</head>
<body>
<div class="frame grain">
  <div class="top"><img class="wm" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed"></div>
  <div class="announce">
    <div class="beam"></div><div class="point"></div>
    <span class="eyebrow" data-text="eyebrow"></span>
  </div>
  <div class="plate"><img data-src="image" alt=""></div>
  <div class="copy">
    <h1 class="hl" data-headline="headline"></h1>
    <div class="label"><span class="t" data-text="title"></span><span class="p" data-text="place"></span></div>
  </div>
  <div class="bottom"><span class="site" data-text="site"></span></div>
</div>
<script src="../fill.js"></script>
</body>
</html>
