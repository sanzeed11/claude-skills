<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>
/* =================== EDIT HERE — copy and image =================== */
var DATA = {
  eyebrow:       "Method",
  headline:      "A method for the monumental.",
  lit_last_word: true,
  step1_n: "Step 01", step1_t: "Discover",
  step2_n: "Step 02", step2_t: "Direct",
  step3_n: "Step 03", step3_t: "Craft",
  step4_n: "Step 04", step4_t: "Deliver",
  site:          "sanzeed.com/#method"
};
/* timing lives in the :root block below; the markup is filled by ../fill.js */
</script>
<title>Post — method, the route — 1080×1080 — 5 s — Sanzeed</title>
<!--
  POST 02 · the method as a route · 5 s · 150 frames @ 30 fps · 1080×1080
  0.2  wordmark and eyebrow rise · 0.5–1.6 the headline types in word by word
  1.8–2.9  the point travels the route left -> right (1100 ms, ease); each step lights as the light passes (the resting points turn gold, the labels rise)
  3.3  the site line · hold to 5 s
  Steps: confirmed method copy (01 Discover · 02 Direct · 03 Craft · 04 Deliver).
  Render: ../render.sh post-method/index.html 1080 1080 5 ../Social_Animations sanzeed-post--method-route-1080x1080 mp4,gif
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE — copy and timing =================== */
  :root { --t-line: .5s; --word-gap: .16s; --t-route: 1.8s; --route-dur: 1.1s; --t-site: 3.3s;
          /* when the light passes each step, from the easing curve (x = 0, 1/3, 2/3, 1 of the route) */
          --s1: 0s; --s2: .16s; --s3: .36s; --s4: .8s; }
  /* ==================================================================== */
  body { --pad: 72px; --eb: 18px; --site: 20px; }
  .lamp { --lamp-y: 62%; --lamp-a: .34; animation: sz-lamp .8s var(--ease) .2s both; }
  .top { position: absolute; left: var(--pad); right: var(--pad); top: var(--pad); display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .wm { width: 220px; animation: sz-rise .4s var(--ease) .2s both; }
  .eyebrow { animation: sz-rise .4s var(--ease) .3s both; }
  .content { position: absolute; left: var(--pad); right: var(--pad); top: 300px; z-index: 3; }
  .hl { font-size: 92px; max-width: 12ch; }
  .hl .w { animation: sz-word .4s var(--ease) both; }
  .hl .w:nth-child(1) { animation-delay: var(--t-line); } .hl .w:nth-child(2) { animation-delay: calc(var(--t-line) + var(--word-gap)); }
  .hl .w:nth-child(3) { animation-delay: calc(var(--t-line) + var(--word-gap) * 2); } .hl .w:nth-child(4) { animation-delay: calc(var(--t-line) + var(--word-gap) * 3); }
  .hl .w:nth-child(5) { animation-delay: calc(var(--t-line) + var(--word-gap) * 4); }
  /* the route: four resting points on a beam; the travelling point lights each one as it passes */
  .route { position: absolute; left: var(--pad); right: var(--pad); top: 760px; z-index: 3; }
  .route .beam { left: 0; right: 0; top: 0; animation: sz-fade-in .4s var(--ease) calc(var(--t-route) - .3s) both; }
  .route .point { left: 0; top: 0; --dot: 14px; --x0: 0px; --x1: 936px; animation: sz-travel var(--route-dur) var(--ease) var(--t-route) both, point-fade 5s linear 0s both; }
  @keyframes point-fade { 0% { opacity: 0; } 32% { opacity: 0; } 36% { opacity: 1; } 54% { opacity: 1; } 60% { opacity: 0; } 100% { opacity: 0; } }
  .steps { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; }
  .step { position: relative; width: 0; }
  .step i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-3); animation: light-up .4s var(--ease) both; }
  .step .n { position: absolute; left: 0; top: 36px; white-space: nowrap; font: 500 16px/1 var(--font-heading); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); animation: sz-rise .4s var(--ease) both; }
  .step .t { position: absolute; left: 0; top: 64px; white-space: nowrap; font: 600 30px/1.2 var(--font-heading); letter-spacing: -0.01em; color: var(--fg); animation: sz-rise .4s var(--ease) both; }
  .step:last-child .n, .step:last-child .t { left: auto; right: 0; text-align: right; }
  @keyframes light-up { from { background: var(--fg-3); box-shadow: none; } to { background: var(--accent); box-shadow: var(--glow); } }
  .step:nth-child(1) > * { animation-delay: calc(var(--t-route) + var(--s1)); }
  .step:nth-child(2) > * { animation-delay: calc(var(--t-route) + var(--s2)); }
  .step:nth-child(3) > * { animation-delay: calc(var(--t-route) + var(--s3)); }
  .step:nth-child(4) > * { animation-delay: calc(var(--t-route) + var(--s4)); }
  .bottom { position: absolute; left: var(--pad); bottom: var(--pad); z-index: 3; animation: sz-rise .4s var(--ease) var(--t-site) both; }
</style>
</head>
<body>
<div class="frame grain">
  <div class="lamp"></div>
  <div class="top">
    <img class="wm" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed">
    <span class="eyebrow" data-text="eyebrow"></span>
  </div>
  <div class="content">
    <h1 class="hl" data-headline="headline"></h1>
  </div>
  <div class="route">
    <div class="beam"></div>
    <div class="steps">
      <div class="step"><i></i><span class="n" data-text="step1_n"></span><span class="t" data-text="step1_t"></span></div>
      <div class="step"><i></i><span class="n" data-text="step2_n"></span><span class="t" data-text="step2_t"></span></div>
      <div class="step"><i></i><span class="n" data-text="step3_n"></span><span class="t" data-text="step3_t"></span></div>
      <div class="step"><i></i><span class="n" data-text="step4_n"></span><span class="t" data-text="step4_t"></span></div>
    </div>
    <div class="point"></div>
  </div>
  <div class="bottom"><span class="site" data-text="site"></span></div>
</div>
<script src="../fill.js"></script>
</body>
</html>
