<title>Story — quote with light wipe — 1080×1920 — 6 s — Sanzeed</title>
<!--
  STORY 02 · quote with light wipe · 6 s · 180 frames @ 30 fps · 1080×1920
  0.2  wordmark and eyebrow rise; the lamp rises (800 ms)
  0.6–1.7  a beam of light wipes the quote on, left -> right (1100 ms, ease): the text is revealed at the hairline, a soft gold trail behind it
  1.9  the attribution rises (name, then descriptor); 2.4 the site line · hold to 6 s
  Quote: confirmed copy from sanzeed.com (also used in 08_SOCIAL_MEDIA ig-post-quote).
  Render: ../render.sh story-quote/index.html 1080 1920 6 ../Social_Animations sanzeed-story--quote-light-wipe-1080x1920 mp4,gif
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE — copy and timing =================== */
  :root { --t-wipe: .6s; --wipe-dur: 1.1s; --t-who: 1.9s; --t-site: 2.4s; }
  /* ==================================================================== */
  body { --pad: 80px; --eb: 20px; --site: 22px; }
  .lamp { --lamp-y: 48%; --lamp-a: .30; animation: sz-lamp .8s var(--ease) .2s both; }
  .top { position: absolute; left: var(--pad); right: var(--pad); top: 270px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .wm { width: 240px; animation: sz-rise .4s var(--ease) .2s both; }
  .eyebrow { animation: sz-rise .4s var(--ease) .3s both; }
  .content { position: absolute; left: var(--pad); right: var(--pad); top: 50%; transform: translateY(-50%); z-index: 3; }
  .quote-wrap { position: relative; }
  .quote { font-size: 64px; max-width: 15.5em; clip-path: inset(0 100% 0 0); animation: sz-wipe var(--wipe-dur) var(--ease) var(--t-wipe) both; }
  .quote::before { content: "\201C"; color: var(--fg-3); } .quote::after { content: "\201D"; color: var(--fg-3); }
  /* the light that does the wiping: a hairline with a gold glow and a soft trail, crossing the quote block on the same curve */
  .light { position: absolute; top: -24px; bottom: -24px; left: -300px; width: 300px; --x0: 0px; --x1: 922px;   /* = the quote block's width (1080 − 2 × 80) + 2: the hairline sits exactly on the clip edge */
           animation: sz-travel var(--wipe-dur) var(--ease) var(--t-wipe) both, light-fade 6s linear 0s both; }
  .light .trail { position: absolute; inset: 0 2px 0 0; background: linear-gradient(90deg, rgba(var(--glow-ink), 0), rgba(var(--glow-ink), .22)); }
  .light .edge { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--fg); box-shadow: 0 0 14px 3px rgba(var(--glow-ink), .9), 0 0 48px 12px rgba(var(--glow-ink), .4); }
  @keyframes light-fade { 0% { opacity: 0; } 9% { opacity: 0; } 12% { opacity: 1; } 24% { opacity: 1; } 29% { opacity: 0; } 100% { opacity: 0; } }
  .who { margin-top: 48px; display: flex; flex-direction: column; gap: 8px; }
  .who .t { font: 600 28px/1.3 var(--font-heading); color: var(--fg); animation: sz-rise .4s var(--ease) var(--t-who) both; }
  .who .p { font: 400 24px/1.4 var(--font-text); color: var(--fg-2); animation: sz-rise .4s var(--ease) calc(var(--t-who) + .15s) both; }
  .bottom { position: absolute; left: var(--pad); bottom: 266px; z-index: 3; animation: sz-rise .4s var(--ease) var(--t-site) both; }
</style>
</head>
<body>
<div class="frame grain">
  <div class="lamp"></div>
  <div class="top">
    <img class="wm" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed">
    <span class="eyebrow" data-text="eyebrow"></span>
  </div>
  <div class="content">
    <div class="quote-wrap">
      <p class="quote" data-text="quote"></p>
      <div class="light"><div class="trail"></div><div class="edge"></div></div>
    </div>
    <div class="who"><span class="t" data-text="who"></span><span class="p" data-text="role"></span></div>
  </div>
  <div class="bottom"><span class="site" data-text="site"></span></div>
</div>
<script src="../fill.js"></script>
</body>
</html>
