<!doctype html>
<html lang="en" data-theme="dark" class="transparent">
<head>
<meta charset="utf-8">
<title>Brand transition — beam of light — 1.5 s — alpha — Sanzeed</title>
<!--
  BRAND TRANSITION · 1.5 s · 45 frames @ 30 fps · transparent (ProRes 4444 / WebM alpha)
  A beam of light wipes across the frame, left -> right: a 1 px hairline leading edge with a gold glow and a soft 420 px trail.
  0.2–1.3 the beam crosses (1100 ms, ease-io — a move between two resting states, never a bounce); nothing else happens.
  Place it over the cut: the hairline is the edit point. The preview (preview.html) shows it cutting from one project image to the next.
  Render: ../render.sh transition/index.html 1920 1080 1.5 ../Intros_Outros sanzeed-transition--alpha-1920x1080 mov,webm transparent
-->
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../motion.css">
<style>
  /* =================== EDIT HERE =================== */
  :root { --t-start: .2s; --t-cross: 1.1s; --trail: 420px; }
  /* ================================================= */
  .sweep { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--trail) - 40px); width: calc(var(--trail) + 40px);
           --x0: 0px; --x1: calc(100vw + var(--trail) + 40px); animation: sz-travel var(--t-cross) var(--ease-io) var(--t-start) both; }
  .sweep .trail { position: absolute; inset: 0 40px 0 0; background: linear-gradient(90deg, rgba(var(--glow-ink), 0) 0%, rgba(var(--glow-ink), .10) 55%, rgba(var(--glow-ink), .42) 100%); }
  .sweep .edge { position: absolute; top: 0; bottom: 0; right: 40px; width: 2px; background: var(--fg); box-shadow: 0 0 18px 4px rgba(var(--glow-ink), .9), 0 0 60px 16px rgba(var(--glow-ink), .45); }
  .sweep .bloom { position: absolute; top: 0; bottom: 0; right: 0; width: 40px; background: linear-gradient(90deg, rgba(var(--glow-ink), .35), rgba(var(--glow-ink), 0)); }
</style>
</head>
<body>
<div class="frame">
  <div class="sweep"><div class="trail"></div><div class="edge"></div><div class="bloom"></div></div>
</div>
</body>
</html>
