<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sanzeed — pattern contact sheet</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css"><link rel="stylesheet" href="../patterns.css">
<style>
body{margin:0;width:1920px} .half{padding:56px 64px 64px} .half.dark{background:#000;color:#F5F5F7} .half.light{background:#F5F0E7;color:#1A1816}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
h1{font:300 40px/1.1 "Fraunces";font-variation-settings:"opsz" 72,"SOFT" 30;letter-spacing:-.01em} h1 .lit{color:var(--accent)}
.light h1 .lit{color:#B8863B} .eyebrow{font:600 12px/1 "Inter Tight";letter-spacing:.12em;text-transform:uppercase;color:#E9B25A} .light .eyebrow{color:#8A6124}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:24px} figure{margin:0}
.sw{aspect-ratio:1;border-radius:20px;border:1px solid rgba(255,255,255,.10)} .light .sw{border-color:rgba(40,30,10,.10)}
figcaption{margin-top:12px;font:400 13px/1.5 "Inter";color:#808086} figcaption b{display:block;font:600 14px/1.4 "Inter Tight";color:inherit} .dark figcaption b{color:#F5F5F7} .light figcaption b{color:#1A1816}
.light figcaption{color:#6D665C}
</style></head><body>
<section class="half dark"><div class="head"><div><div class="eyebrow">Patterns · dark ink</div><h1>Seven tiles, <span class="lit">lit.</span></h1></div><div class="eyebrow">tiles shown at 50 % · use at ≤ 12 % opacity</div></div><div class="grid"><figure><div class="sw pat-dot-grid-fine--dark" style="background-size:128px 128px"></div><figcaption><b>dot-grid-fine</b><span>256 × 256 px · dark ink</span></figcaption></figure><figure><div class="sw pat-dot-grid-coarse--dark" style="background-size:128px 128px"></div><figcaption><b>dot-grid-coarse</b><span>256 × 256 px · dark ink</span></figcaption></figure><figure><div class="sw pat-beam-lines--dark" style="background-size:256px 256px"></div><figcaption><b>beam-lines</b><span>512 × 512 px · dark ink</span></figcaption></figure><figure><div class="sw pat-arch-repeat--dark" style="background-size:256px 256px"></div><figcaption><b>arch-repeat</b><span>512 × 512 px · dark ink</span></figcaption></figure><figure><div class="sw pat-route--dark" style="background-size:256px 256px"></div><figcaption><b>route</b><span>512 × 512 px · dark ink</span></figcaption></figure><figure><div class="sw pat-monogram-repeat--dark" style="background-size:256px 256px"></div><figcaption><b>monogram-repeat</b><span>512 × 512 px · dark ink</span></figcaption></figure><figure><div class="sw pat-s-curve--dark" style="background-size:256px 256px"></div><figcaption><b>s-curve</b><span>512 × 512 px · dark ink</span></figcaption></figure></div></section>
<section class="half light"><div class="head"><div><div class="eyebrow">Patterns · light ink</div><h1>The same seven, on <span class="lit">Plaster.</span></h1></div><div class="eyebrow">tiles shown at 50 % · use at ≤ 12 % opacity</div></div><div class="grid"><figure><div class="sw pat-dot-grid-fine--light" style="background-size:128px 128px"></div><figcaption><b>dot-grid-fine</b><span>256 × 256 px · light ink</span></figcaption></figure><figure><div class="sw pat-dot-grid-coarse--light" style="background-size:128px 128px"></div><figcaption><b>dot-grid-coarse</b><span>256 × 256 px · light ink</span></figcaption></figure><figure><div class="sw pat-beam-lines--light" style="background-size:256px 256px"></div><figcaption><b>beam-lines</b><span>512 × 512 px · light ink</span></figcaption></figure><figure><div class="sw pat-arch-repeat--light" style="background-size:256px 256px"></div><figcaption><b>arch-repeat</b><span>512 × 512 px · light ink</span></figcaption></figure><figure><div class="sw pat-route--light" style="background-size:256px 256px"></div><figcaption><b>route</b><span>512 × 512 px · light ink</span></figcaption></figure><figure><div class="sw pat-monogram-repeat--light" style="background-size:256px 256px"></div><figcaption><b>monogram-repeat</b><span>512 × 512 px · light ink</span></figcaption></figure><figure><div class="sw pat-s-curve--light" style="background-size:256px 256px"></div><figcaption><b>s-curve</b><span>512 × 512 px · light ink</span></figcaption></figure></div></section>
</body></html>
