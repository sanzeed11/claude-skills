<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>Sanzeed — 4x5 frame (1080×1350)</title>
  <desc>Editable image frame. Replace the rect #IMAGE_PLACEHOLDER with your photograph (clip it with #image-clip). Keep the veil above the image and the wall label above the veil. Fonts: Inter Tight (600 / 500) and Inter (400) — install from 04_TYPOGRAPHY/Font_Files. Lamp Gold #E9B25A is the only accent.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0.38" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/></linearGradient>
    <clipPath id="image-clip"><rect x="0" y="0" width="1080" height="1350" rx="0"/></clipPath>
  </defs>
  <rect id="background" width="1080" height="1350" fill="#0D0D0F"/>
  <g id="IMAGE" clip-path="url(#image-clip)">
    <rect id="IMAGE_PLACEHOLDER" x="0" y="0" width="1080" height="1350" fill="#1C1C1E"/>
  </g>
  <rect id="veil-gradient" x="0" y="0" width="1080" height="1350" rx="0" fill="url(#veil)"/>
  
  <g id="wall-label" font-family="'Inter Tight', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text id="counter" x="71" y="1204" font-size="17" font-weight="500" letter-spacing="2.0" fill="#E9B25A">001</text>
    <text id="title" x="71" y="1246" font-size="28" font-weight="600" fill="#F5F5F7">[Project title]</text>
    <text id="place" x="71" y="1279" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#A1A1A6">[Place]</text>
  </g>
  <g id="GUIDES — delete before export" stroke="#E9B25A" stroke-opacity="0.35" stroke-dasharray="6 8" fill="none">
    <rect x="71" y="71" width="938" height="1208"/>
  </g>
</svg>
