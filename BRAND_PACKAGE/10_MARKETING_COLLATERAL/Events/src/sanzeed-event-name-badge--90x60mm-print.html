<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanzeed — name badge 90x60 mm (print, 3 mm bleed)</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../../_shared/collateral.css">
<style>


@page { margin: 0; }
body { background: #000; }
.sheet { font-family: var(--font-text); }
.mark { position: absolute; display: block; }
.eyebrow-quiet { font-size: 7.5pt; }
.hl { color: var(--fg); }
.details { font-size: 9pt; line-height: 1.6; color: var(--fg-2); }
.details b { font-family: var(--font-heading); font-weight: 600; color: var(--fg); display: inline-block; min-width: 18mm; }
.details .field { color: var(--fg); }
.wl { font-size: 7.5pt; }

@page { size: 96mm 66mm; }
.sheet { width: 96mm; height: 66mm; }
.in { position: absolute; left: 3mm; top: 3mm; width: 90mm; height: 60mm; }
.sym { position: absolute; right: 7mm; top: 7mm; width: 7mm; }
.eyebrow-quiet { position: absolute; left: 7mm; top: 8mm; font-size: 5.5pt; }
.name { position: absolute; left: 7mm; top: 20mm; width: 76mm; font-size: 17pt; line-height: 1.05; color: var(--fg); }
.role { position: absolute; left: 7mm; top: 36mm; width: 76mm; font-size: 7.5pt; color: var(--fg-2); }
.mark { left: 7mm; bottom: 7mm; width: 28mm; }
.url { position: absolute; right: 7mm; bottom: 7.3mm; font-size: 6pt; color: var(--fg-3); }

</style>
</head>
<body>
<section class="sheet grain" id="host"><div class="in">
  <img class="sym" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-symbol--full-colour-dark.svg" alt="S.">
  <div class="eyebrow-quiet">Host</div>
  <div class="name hl">Sanzeed Mirza</div>
  <div class="role">Experiential Design Consultant</div>
  <img class="mark" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-simplified-small-size--full-colour-dark.svg" alt="Sanzeed">
  <div class="url">sanzeed.com</div>
</div></section>
<section class="sheet grain" id="guest"><div class="in">
  <img class="sym" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-symbol--full-colour-dark.svg" alt="S.">
  <div class="eyebrow-quiet">Guest</div>
  <div class="name hl">[Name]</div>
  <div class="role">[Organisation]</div>
  <img class="mark" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-simplified-small-size--full-colour-dark.svg" alt="Sanzeed">
  <div class="url">sanzeed.com</div>
</div></section>
</body>
</html>
