<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanzeed — digital ad 160x600</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../../_shared/collateral.css">
<style>


.ad { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-text); }
.ad .logo { position: absolute; display: block; }
.ad .hl { color: var(--fg); }
.ad .sub { color: var(--fg-2); line-height: 1.4; }
.ad .plate { position: absolute; }
.ad .cta { position: absolute; }
.ad .url { position: absolute; color: var(--fg-3); font-size: 11px; letter-spacing: .02em; }
.ad .arrow { display: inline-block; }
.ad { width:160px; height:600px; }

   .logo { left: 24px; top: 24px; }
   .plate { left: 16px; top: 62px; width: 128px; height: 160px; border-radius: 12px; }
   .hl { position: absolute; left: 16px; top: 244px; width: 128px; font-size: 24px; line-height: 1.08; }
   .sub { position: absolute; left: 16px; top: 396px; width: 128px; font-size: 12px; }
   .cta { left: 16px; bottom: 44px; padding: 9px 13px; font-size: 12px; white-space: nowrap; }
   .url { left: 16px; bottom: 20px; }
</style>
</head>
<body><div class="ad">
  <img class="logo" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-simplified-small-size--full-colour-dark.svg" alt="Sanzeed" style="width:112px">
  <div class="plate"><img src="../../_shared/img/hero-object--dark-4x5-1600.jpg" alt="The point of light: a black glass sphere with a gold ring on a dark plinth"></div>
  <div class="hl">Experiential design you can walk into<span class="pt">.</span></div>
  <div class="sub">Museums, pavilions and shows.</div>
  <a class="cta" href="https://sanzeed.com">Get in touch →</a>
  <span class="url">sanzeed.com</span>
</div></body>
</html>
