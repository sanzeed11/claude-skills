<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanzeed — digital ad 300x600</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../../_shared/collateral.css">
<style>


.ad { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-text); }
.ad .logo { position: absolute; display: block; }
.ad .hl { color: var(--fg); }
.ad .sub { color: var(--fg-2); line-height: 1.4; }
.ad .plate { position: absolute; }
.ad .cta { position: absolute; }
.ad .url { position: absolute; color: var(--fg-3); font-size: 11px; letter-spacing: .02em; }
.ad .arrow { display: inline-block; }
.ad { width:300px; height:600px; }

   .logo { left: 24px; top: 28px; }
   .plate { left: 24px; top: 72px; width: 252px; height: 200px; border-radius: 20px; }
   .wl { position: absolute; left: 24px; top: 284px; font-size: 11px; }
   .hl { position: absolute; left: 24px; top: 322px; width: 252px; font-size: 34px; line-height: 1.05; }
   .sub { position: absolute; left: 24px; top: 440px; width: 252px; font-size: 13px; }
   .cta { left: 24px; bottom: 28px; padding: 10px 16px; font-size: 13px; }
   .url { display: none; }
</style>
</head>
<body><div class="ad">
  <img class="logo" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed" style="width:130px">
  <div class="plate"><img src="../../_shared/img/hero-object--dark-2400.jpg" alt="The point of light: a black glass sphere with a gold ring on a dark plinth"></div>
  <div class="wl"><b>Between two points of light</b><span class="sep">·</span>sanzeed.com</div>
  <div class="hl">Experiential design you can walk into<span class="pt">.</span></div>
  <div class="sub">Museums, pavilions and shows — one vision from the brief to opening night.</div>
  <a class="cta" href="https://sanzeed.com">Tell me about the room →</a>
  <span class="url">sanzeed.com</span>
</div></body>
</html>
