<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Instagram portrait — method step — 1080×1350 — Sanzeed</title>
<script>
/* =================== EDIT HERE — one step of the method ===================
   step = 1…4 lights that point on the route. Copy from sanzeed.com/#method. */
var DATA = {
  eyebrow:   "Method",
  counter:   "Step 02 / 04",
  headline:  "Direct.",
  lit_last_word: false,
  body:      "A unifying creative vision that aligns designers, architects, writers, producers and technologists toward one outcome.",
  receive:   "You receive",
  deliverable: "a concept book and a walkthrough film.",
  step:      2,
  site:      "sanzeed.com/#method"
};
/* ================================================================================ */
</script>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../social.css">
<style>
  .content { top: 47%; }
  .counter { display: block; margin-bottom: 28px; }
  .hl { font-size: 160px; line-height: .95; }
  .body { margin-top: 40px; font-size: 27px; max-width: 32ch; }
  .receive { margin-top: 44px; font: 400 27px/1.5 var(--font-text); color: var(--fg-3); max-width: 30ch; }
  .receive b { display: block; font: 600 30px/1.35 var(--font-heading); color: var(--fg); letter-spacing: -0.01em; }
  .bottom { flex-direction: column; align-items: stretch; gap: 22px; }
  .route { height: 28px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
</style>
</head>
<body class="f-pt">
<div class="frame grain">
  <div class="top">
    <img class="wm" src="../../../02_LOGO_SYSTEM/SVG/sanzeed-primary-wordmark--full-colour-dark.svg" alt="Sanzeed">
    <span class="eyebrow" data-text="eyebrow"></span>
  </div>
  <div class="content">
    <span class="counter" data-text="counter"></span>
    <h1 class="hl" data-headline="headline"></h1>
    <p class="body" data-text="body"></p>
    <p class="receive"><span data-text="receive"></span><b data-text="deliverable"></b></p>
  </div>
  <div class="bottom">
    <div class="route"><i data-step="1"></i><i data-step="2"></i><i data-step="3"></i><i data-step="4"></i></div>
    <div class="route-labels"><span data-step="1">01 Discover</span><span data-step="2">02 Direct</span><span data-step="3">03 Craft</span><span data-step="4">04 Deliver</span></div>
    <div class="foot"><span class="site" data-text="site"></span></div>
  </div>
</div>
<script src="../fill.js"></script>
<script>
  /* light the current step on the route */
  document.querySelectorAll('[data-step]').forEach(function (el) { var on = +el.dataset.step === +DATA.step; el.classList.toggle('on', on); if (el.tagName === 'SPAN') el.innerHTML = on ? '<b>' + el.textContent + '</b>' : el.textContent; });
</script>
</body>
</html>
