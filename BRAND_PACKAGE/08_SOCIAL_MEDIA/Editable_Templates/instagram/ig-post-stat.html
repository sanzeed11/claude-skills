<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Instagram post — stat — 1080×1080 — Sanzeed</title>
<script>
/* =================== EDIT HERE — the number and the line ===================
   number + unit make the big figure; headline is the proof line beneath. Secondary figures are optional. */
var DATA = {
  eyebrow:   "The galleries",
  number:    "90",
  plus:      "",                         // "+" to show a gold plus after the number
  headline:  "projects, one continuous craft.",
  lit_last_word: true,
  stat1_n: "15+", stat1_l: "years",
  stat2_n: "8+",  stat2_l: "years experiential & museum",
  stat3_n: "60+", stat3_l: "museums & centres",
  site:      "sanzeed.com/#galleries"
};
/* ================================================================================ */
</script>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<link rel="stylesheet" href="../social.css">
<style>
  .content { top: 46%; }
  .stat { font-size: 420px; margin-left: -14px; }
  .hl { font-size: 72px; margin-top: 10px; max-width: 12ch; }
  .stats { display: flex; gap: 56px; }
  .stats div { display: flex; flex-direction: column; gap: 6px; }
  .stats .n { font: 300 44px/1 var(--font-display); font-variation-settings: "opsz" 72; font-variant-numeric: tabular-nums; color: var(--fg); }
  .stats .l { font: 400 20px/1.3 var(--font-text); color: var(--fg-3); }

</style>
</head>
<body class="f-sq">
<div class="frame grain">

  <div class="top">

    <span class="eyebrow" data-text="eyebrow"></span>

  <div class="content">

  <div class="bottom">
    <div class="stats">

      <div><span class="n" data-text="stat2_n"></span><span class="l" data-text="stat2_l"></span></div>
      <div><span class="n" data-text="stat3_n"></span><span class="l" data-text="stat3_l"></span></div>
