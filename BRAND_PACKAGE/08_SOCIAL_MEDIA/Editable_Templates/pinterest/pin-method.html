<style>
  .top { align-items: center; }
  .hl { position: absolute; left: var(--pad); right: var(--pad); top: 190px; font-size: 80px; max-width: 11ch; z-index: 3; }
  .steps { position: absolute; left: var(--pad); right: var(--pad); top: 460px; z-index: 3; }
  .step { display: grid; grid-template-columns: 90px 1fr; gap: 0 24px; padding: 34px 0; border-top: 1px solid var(--line); position: relative; }

  .step.on::before { background: var(--accent); }
  .step .n { font: 500 18px/1 var(--font-heading); letter-spacing: .08em; color: var(--accent-text); font-variant-numeric: tabular-nums; padding-top: 10px; }
  .step .t { font: 300 48px/1 var(--font-display); font-variation-settings: "opsz" 72, "SOFT" 30; color: var(--fg); letter-spacing: -0.01em; }
  .step .d { grid-column: 2; margin-top: 12px; font: 400 22px/1.45 var(--font-text); color: var(--fg-2); max-width: 30ch; }
  .steps .last { border-top: 1px solid var(--line); }
  .bottom { bottom: 64px; align-items: flex-end; }
  .foot { font: 400 20px/1.45 var(--font-text); color: var(--fg-3); max-width: 30ch; }
