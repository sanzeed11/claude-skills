<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Trusted by — social proof strip</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<style>
  html,body{margin:0;overflow:hidden} body{background:var(--bg);color:var(--fg)}
  .strip{width:1600px;height:200px;display:flex;align-items:center;justify-content:center;gap:40px;padding:0 80px;box-sizing:border-box;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .strip .k{flex:none;font:600 12px/1 var(--font-heading);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
  .strip .names{display:flex;align-items:center;gap:28px;font-family:var(--font-display);font-weight:300;font-size:34px;letter-spacing:-.01em;font-variation-settings:"opsz" 48,"SOFT" 30,"WONK" 0;color:var(--fg)}
  .strip .names i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
  .strip .tail{flex:none;max-width:22ch;font:400 15px/1.5 var(--font-text);color:var(--fg-2)}
</style></head>
<body>
<div class="strip">
  <span class="k">Trusted by</span>
  <div class="names"><span>PwC</span><i></i><span>Microsoft</span><i></i><span>Discovery</span><i></i><span>National Museums</span></div>
  <span class="tail">from concept to public unveiling.</span>
</div>
</body></html>
