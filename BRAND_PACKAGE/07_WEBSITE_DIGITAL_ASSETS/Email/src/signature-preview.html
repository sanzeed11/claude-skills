<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signature preview — Sanzeed</title>
<link rel="stylesheet" href="../../../15_SOURCE_FILES/Project_Files/brand-kit/brand.css">
<style>
  html, body { margin: 0; } body { background: #ECE7DC; padding: 48px; color: #1A1816; }
  .mail { width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.08); overflow: hidden; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
  .bar { padding: 14px 20px; border-bottom: 1px solid #ECE7DC; font-size: 13px; color: #665F55; display: grid; gap: 6px; }
  .bar b { color: #1A1816; font-weight: 500; }
  .body { padding: 24px 28px 32px; font-size: 15px; line-height: 1.55; }
  .body p { margin: 0 0 14px; }
  .sig { margin-top: 28px; }
  .cap { width: 720px; margin: 0 auto 14px; font: 600 11px/1 "Inter Tight", Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8A6124; }
</style>
</head>
<body>
  <div class="cap">Email signature · as received (light client)</div>
  <div class="mail">
    <div class="bar"><span><b>From:</b> Sanzeed Mirza &lt;sanzeed@gmail.com&gt;</span><span><b>Subject:</b> Re: The room — a first conversation</span></div>
    <div class="body">
      <p>Thank you for writing. I’ve read the brief twice. Could we speak on Thursday for twenty minutes?</p>
      <p>The first conversation is always free.</p>
      <p>— Sanzeed</p>
      <div class="sig" id="sig"><!--SIGNATURE--></div>
    </div>
  </div>

</body>
